services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${TASKFLOW_PROFILES:-prod}
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TASKFLOW_DEMO_PASSWORD: ${TASKFLOW_DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TASKFLOW_API_PORT:-8080}:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${TASKFLOW_UI_PORT:-3000}:80"
volumes:
  postgres-data:
